name: Expand staged source bundle

on:
  push:
    paths:
      - '.release/*source-bundle*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand source snapshot
        shell: python
        run: |
          from pathlib import Path
          import re

          candidates = sorted(Path('.release').glob('*source-bundle*.md'), key=lambda p: p.stat().st_mtime, reverse=True)
          if not candidates:
              raise SystemExit('No staged source bundle found')
          source = candidates[0]
          text = source.read_text(encoding='utf-8')
          if not text.startswith('# Codex Dashboard v0.2.0 source bundle'):
              raise SystemExit('Staged object is not the expected source snapshot')

          pattern = re.compile(r'(?ms)^## FILE `([^`]+)`\n\n````\n(.*?)\n````\n')
          files = pattern.findall(text)
          if len(files) < 20:
              raise SystemExit(f'Only {len(files)} files decoded; refusing partial publish')

          protected = {'.git', '.release'}
          for rel, content in files:
              path = Path(rel)
              if path.is_absolute() or '..' in path.parts or path.parts[0] in protected:
                  raise SystemExit(f'Unsafe path: {rel}')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')
          print(f'Expanded {len(files)} files from {source}')
      - name: Commit expanded source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source tree already current"
          else
            git commit -m "feat: publish Codex Dashboard v0.2.0 source tree"
            git push origin HEAD:main
          fi
