name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Compile Python sources
        run: python -m compileall -q codex_dashboard tests
      - name: Run rule and integration tests
        run: python -m unittest discover -s tests -v
      - name: Validate browser JavaScript
        run: node --check codex_dashboard/static/app.js
      - name: Smoke-test CLI
        run: |
          codex-dashboard --help
          python -m codex_dashboard --help
