[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-control-center"
version = "1.0.0"
description = "Local-first observability and control dashboard for Codex sessions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Codex Dashboard contributors"}]
keywords = ["codex", "dashboard", "observability", "sqlite", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: No Framework",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = []

[project.scripts]
codex-dashboard = "codex_dashboard.cli:main"

[tool.setuptools]
packages = ["codex_dashboard"]
include-package-data = true

[tool.setuptools.package-data]
codex_dashboard = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg"]
